<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Rate Intelligence — Miami Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F2E7; --surface:#FFFDF6; --surface2:#FBF7EC;
  --line:#E6DEC9; --line2:#DCD2B8;
  --ink:#22332B; --muted:#7A7F6E; --faint:#A8AC97;
  --green:#1E5631; --green2:#2E7D32; --green-soft:#E9F0E4;
  --gold:#B98A1F; --gold2:#8A6A14; --gold-soft:#F4ECD4;
  --coral:#D9622B; --coral-soft:#F9E4D8;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,sans-serif;display:flex;min-height:100vh}
/* ————— sidebar ————— */
aside{width:76px;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:8px;position:sticky;top:0;height:100vh}
.logo{width:42px;height:42px;border-radius:12px;background:var(--green);color:#F6F2E7;
  display:grid;place-items:center;font:700 17px Fraunces,serif;letter-spacing:.5px}
.navi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;cursor:pointer;
  color:var(--faint);border:none;background:transparent;transition:.18s}
.navi:hover{background:var(--surface2);color:var(--ink)}
.navi.on{background:var(--green-soft);color:var(--green)}
.navi svg{width:21px;height:21px}
/* ————— main ————— */
main{flex:1;padding:30px 38px 60px;max-width:1240px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font:600 34px/1.15 Fraunces,serif;color:var(--gold2);letter-spacing:-.2px}
.date{color:var(--muted);font-size:13.5px;margin-top:5px;letter-spacing:.2px}
.btn{background:var(--green);color:#F6F2E7;border:none;border-radius:11px;padding:11px 20px;
  font:600 13.5px Inter,sans-serif;cursor:pointer;letter-spacing:.2px;box-shadow:0 1px 0 rgba(34,51,43,.25)}
.btn:active{transform:translateY(1px)}
/* ————— KPI cards ————— */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:26px 0 8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 14px}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;font-weight:600}
.kpi .val{font:600 30px/1.2 "JetBrains Mono",monospace;margin-top:6px}
.kpi .sub{font-size:12px;margin-top:3px;color:var(--muted)}
.kpi .sub b.up{color:var(--green2)} .kpi .sub b.dn{color:var(--coral)}
/* ————— panels ————— */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-top:16px}
.panel h2{font:600 19px Fraunces,serif;color:var(--gold2);display:flex;align-items:center;justify-content:space-between}
.panel h2 small{font:600 11.5px Inter,sans-serif;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
canvas#chart{width:100%;height:280px;display:block;margin-top:14px}
/* ————— tables ————— */
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
  font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--surface2)}
tr:last-child td{border-bottom:none}
.mono{font-family:"JetBrains Mono",monospace;font-size:12.5px}
.tag{display:inline-block;padding:2.5px 10px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.3px}
.tag.hot{background:var(--coral-soft);color:var(--coral)}
.tag.warm{background:var(--gold-soft);color:var(--gold2)}
.tag.watch{background:var(--green-soft);color:var(--green)}
.scorebar{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;min-width:70px}
.scorebar i{display:block;height:100%;border-radius:99px;background:var(--green2)}
.scorebar i.hot{background:var(--coral)} .scorebar i.warm{background:var(--gold)}
ul.signals{margin:6px 0 0;padding-left:16px;color:var(--muted);font-size:12.5px}
ul.signals li{margin:2px 0}
.runs{margin-top:14px;font:12px "JetBrains Mono",monospace;color:var(--muted)}
footer{margin-top:26px;color:var(--faint);font-size:12px;letter-spacing:.3px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold2);
  padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600}
</style>
</head>
<body>
<aside>
  <div class="logo">H</div>
  <button class="navi on" title="Overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></button>
  <button class="navi" title="Rates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg></button>
  <button class="navi" title="Contacts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5S14.7 16.4 15.5 20"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15.8 14.6c2.9.1 5 1.8 5.7 4.9"/></svg></button>
  <button class="navi" title="Prospects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.4 5.3 5.6.7-4.1 4 1 5.6L12 15l-4.9 2.6 1-5.6-4.1-4 5.6-.7z"/></svg></button>
</aside>
<main>
  <div class="top">
    <div>
      <h1 id="greeting">Good morning, Jasmel</h1>
      <div class="date" id="dateline"></div>
    </div>
    <button class="btn" onclick="refresh()">↻ Refresh data</button>
  </div>

  <section class="kpis" id="kpis"></section>

  <div class="grid2">
    <div class="panel">
      <h2>Nightly rate by hotel <small id="chart-sub">latest run</small></h2>
      <canvas id="chart" height="280"></canvas>
    </div>
    <div class="panel">
      <h2>Who needs it <small>prospect score</small></h2>
      <div id="prospects"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Competitive set <small id="comp-sub"></small></h2>
    <div id="complist" style="overflow-x:auto"></div>
  </div>

  <div class="panel">
    <h2>Collector runs <small>last 10</small></h2>
    <div class="runs" id="runs"></div>
  </div>

  <footer>Hotel Rate Intelligence · Miami Beach boutique comp set · self-hosted scraper — no paid data API · palette after @_code_and_chill_ finance dashboard</footer>
</main>

<script>
const $=s=>document.querySelector(s);
const money=n=>n==null?'—':'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening';}
$('#greeting').textContent=greeting()+', Jasmel';
$('#dateline').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' · Miami Beach comp set';

async function refresh(){
  const [sum,hot]=await Promise.all([fetch('/api/summary').then(r=>r.json()),fetch('/api/hotels').then(r=>r.json())]);
  renderKpis(sum); renderChart(sum.rates); renderProspects(sum.prospects); renderComp(hotels=hot.hotels); renderRuns(sum.runs);
  $('#chart-sub').textContent=sum.currency+' · latest observation per hotel';
}
function renderKpis(s){
  const k=s.kpis;
  $('#kpis').innerHTML=[
    ['Tracked hotels',k.hotels,s.rates.length+' with rate data'],
    ['Contacts captured',k.contacts,'emails · phones · addresses'],
    ['Rate observations',k.rates,'stored rows'],
    ['Hot prospects',k.hot_prospects,'score ≥ 70'],
  ].map(([l,v,sub])=>`<div class="kpi"><div class="lbl">${l}</div><div class="val" style="color:var(--gold2)">${v}</div><div class="sub">${sub}</div></div>`).join('');
}
/* hand-rolled grouped bar chart: price bar + prev-price ghost, coral if down vs green */
function renderChart(rates){
  const c=$('#chart'),dpr=window.devicePixelRatio||1;
  const W=c.clientWidth,H=280;c.width=W*dpr;c.height=H*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const data=rates.filter(r=>r.price!=null);if(!data.length){x.fillStyle='#A8AC97';x.font='14px Inter';x.fillText('No rate observations yet — run the collector.',20,40);return;}
  const max=Math.max(...data.map(r=>Math.max(r.price,r.prev_price||0)))*1.12||1;
  const pad={l:56,r:14,t:14,b:64},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  x.strokeStyle='#E6DEC9';x.fillStyle='#7A7F6E';x.font='11px JetBrains Mono';
  for(let i=0;i<=4;i++){const y=pad.t+ih-ih*i/4;x.beginPath();x.moveTo(pad.l,y);x.lineTo(W-pad.r,y);x.stroke();
    x.fillText('$'+(max*i/4).toFixed(0),8,y+4);}
  const bw=Math.min(34,(iw/data.length)*0.52),gap=(iw-bw*data.length*1.6)/Math.max(1,data.length-1);
  data.forEach((r,i)=>{
    const cx=pad.l+iw-(i+1)*(bw*1.6+gap)+bw/2; /* newest first, right to left like ledgers */
    const up=r.prev_price==null||r.price>=r.prev_price;
    const h1=ih*r.price/max,y1=pad.t+ih-h1;
    if(r.prev_price!=null){x.fillStyle='#DCD2B8';const hp=ih*r.prev_price/max;
      x.fillRect(cx-bw/2-3,pad.t+ih-hp,bw*0.32,hp);}
    x.fillStyle=up?'#2E7D32':'#D9622B';round(x,cx-bw/4,y1,bw*0.68,h1,3);
    x.fillStyle='#22332B';x.font='600 10.5px JetBrains Mono';x.textAlign='center';
    x.fillText(money(r.price),cx,y1-6);
    x.save();x.translate(cx,pad.t+ih+10);x.rotate(-.6);x.fillStyle='#7A7F6E';x.font='10.5px Inter';
    x.fillText(r.name.split(',')[0].slice(0,18),0,10);x.restore();x.textAlign='left';
  });
  x.fillStyle='#A8AC97';x.font='11px Inter';
  x.fillRect(pad.l,8,10,10)&&x.fillText('current',pad.l+16,16);
  x.fillStyle='#DCD2B8';x.fillRect(pad.l+80,8,10,10);x.fillStyle='#A8AC97';x.fillText('previous',pad.l+96,16);
}
function round(x,a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h);x.fill();}
function renderProspects(ps){
  $('#prospects').innerHTML=ps.slice(0,8).map(p=>`
    <div style="padding:10px 0;border-bottom:1px solid var(--surface2)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div><b>${p.name}</b> <span style="color:var(--muted);font-size:12px">${p.area||''} ${p.stars?p.stars+'★':''}</span></div>
        <span class="tag ${p.tier}">${p.tier} · ${p.score}</span>
      </div>
      <div class="scorebar" style="margin-top:7px"><i class="${p.tier}" style="width:${p.score}%"></i></div>
      <ul class="signals">${p.signals.slice(0,3).map(s=>`<li>${s}</li>`).join('')}</ul>
    </div>`).join('')||'<div style="color:var(--muted);margin-top:10px">Run the collector to score prospects.</div>';
}
function renderComp(hotels){
  $('#comp-sub').textContent=hotels.length+' hotels';
  $('#complist').innerHTML=`<table><thead><tr><th>Hotel</th><th>Area</th><th>★</th><th>Est. rooms</th><th>Contacts</th></tr></thead><tbody>`+
    hotels.map(h=>`<tr>
      <td><b>${h.name}</b></td><td>${h.area||'—'}</td><td>${h.stars||'—'}</td>
      <td class="mono">${h.est_rooms||'—'}</td>
      <td>${h.contacts.map(c=>`<span class="pill">${c.kind}: ${c.value.length>26?c.value.slice(0,26)+'…':c.value}</span>`).join(' ')||'<span style="color:var(--faint)">—</span>'}</td>
    </tr>`).join('')+'</tbody></table>';
}
function renderRuns(runs){
  $('#runs').innerHTML=runs.map(r=>`#${r.id} ${r.status} · ${r.mode} · attempted ${r.hotels_attempted} ok ${r.hotels_ok} · +${r.contacts_new} contacts +${r.rates_new} rates`).join('<br>')||'no runs yet';
}
refresh();setInterval(refresh,60000);
</script>
</body>
</html>
